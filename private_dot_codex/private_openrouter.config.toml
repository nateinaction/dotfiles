# Codex profile layered over ~/.codex/config.toml: `codex -p openrouter`.
# Kept in its own file because Codex rewrites config.toml itself.
# OPENROUTER_API_KEY comes from conf.d/openrouter.secret.fish. Command-based
# auth makes Codex refresh its model catalog for non-OpenAI models.
model_provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash"

[model_providers.openrouter]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"

[model_providers.openrouter.auth]
command = "sh"
args = ["-c", "echo $OPENROUTER_API_KEY"]
